# The one gate per pull request: the required check "test" that GitHub's auto-merge waits for. On main
# pushes too, to catch the rare break an optimistic merge lets through. No dependencies: nothing to install.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job on one Node: the minimum package.json's engines declares, so CI tests what nuworq promises to run on
  # (#811). Newer Nodes get the suite on the machines that run workers. test/ciworkflow.test.js keeps the two in step.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
