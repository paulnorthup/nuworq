# The one gate per pull request: the required check "test" that GitHub's auto-merge waits for. On main
# pushes too, to catch the rare break an optimistic merge lets through. No dependencies: nothing to install.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every supported Node: the engines floor and maintenance LTS (24), and the active LTS (26).
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  # The required check keeps its name: it passes only when every Node passed.
  test:
    if: always()
    needs: node
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.node.result }}" = success
