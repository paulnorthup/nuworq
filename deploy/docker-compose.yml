# From the repository root:
#   docker compose -f deploy/docker-compose.yml run --rm nuworq node bin/nuworq.js token create <you> --role human
#   docker compose -f deploy/docker-compose.yml up -d
services:
  nuworq:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Published on the host's loopback only. Put Caddy or `tailscale serve` in front,
    # or change to "4747:4747" to expose it on your LAN (login is always required in the container).
    ports:
      - "127.0.0.1:4747:4747"
    # Behind a reverse proxy, trust its X-Forwarded-* headers (client IP, https, host):
    # command: ["node", "bin/nuworq.js", "serve", "--host", "0.0.0.0", "--db", "/data/nuworq.db", "--trust-proxy"]
    volumes:
      - nuworq-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs: [/tmp]

volumes:
  nuworq-data:
