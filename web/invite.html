<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nuworq · Join</title>
  <link rel="icon" href="<!--favicon-->">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login">
    <form class="login-card" id="join" autocomplete="off">
      <div class="brand">
        <!--logo-->
        <span>nuworq</span>
      </div>
      <p class="lead" id="lead">Checking your invite…</p>
      <input id="handle" placeholder="Pick a handle, e.g. bea" spellcheck="false" autocapitalize="off" required hidden>
      <div id="error" class="login-error" role="alert" hidden></div>
      <button class="btn primary" type="submit" id="go" hidden>Join</button>
    </form>
  </main>
  <script type="module" src="invite.js"></script>
</body>
</html>
