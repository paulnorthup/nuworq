<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trellis · Log in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M8 24L24 8M8 16l8-8M16 24l8-8M8 8l16 16M8 16l8 8M16 8l8 8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login">
    <form class="login-card" id="login" autocomplete="off">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--agents)"/><path d="M8 24L24 8M8 16l8-8M16 24l8-8M8 8l16 16M8 16l8 8M16 8l8 8" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Trellis</span>
      </div>
      <p class="lead">This Trellis hub is private. Paste your human token.</p>
      <input id="token" type="password" placeholder="trl_…" spellcheck="false" autocapitalize="off" required>
      <div id="error" class="login-error" role="alert" hidden></div>
      <button class="btn primary" type="submit" id="go">Log in</button>
      <p class="hint">No token? On the hub host, run <code>trellis token create &lt;name&gt; --role human</code>.</p>
    </form>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
