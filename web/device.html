<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nuworq · Connect a machine</title>
  <link rel="icon" href="<!--favicon-->">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login">
    <form class="login-card" id="device" autocomplete="off">
      <div class="brand">
        <!--logo-->
        <span>nuworq</span>
      </div>
      <p class="lead" id="lead">Enter the code your terminal shows.</p>
      <input id="code" placeholder="e.g. WDJB-MJHT" spellcheck="false" autocapitalize="characters" required>
      <div id="error" class="login-error" role="alert" hidden></div>
      <button class="btn primary" type="submit" id="go">Continue</button>
      <button class="btn" type="button" id="deny" hidden>Deny</button>
    </form>
  </main>
  <script type="module" src="device.js"></script>
</body>
</html>
